[package]
name = "swapprism"
version = "0.30.0"
edition = "2021"

[[bin]]
name = "SWAPPRISM"
path = "src/main.rs"

[[bin]]
name = "SWAPPRISMUpdate"
path = "src/update_runner.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = { version = "=0.31.1", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
rfd = "0.15"
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
wry = { version = "=0.57.3", default-features = false, features = ["os-webview"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects"] }

[profile.release]
opt-level = 2
strip = true


